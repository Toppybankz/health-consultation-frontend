name: Frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React application
        run: npm run build
        env:
          CI: false
          NODE_OPTIONS: --openssl-legacy-provider
